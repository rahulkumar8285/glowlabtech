services:
  growthtechsys-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: growthtechsys-web
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      - NODE_ENV=production
      - PORT=80
      - SMTP_HOST=${SMTP_HOST:-smtp.hostinger.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-info@growthtechsys.com}
      - SMTP_PASS=${SMTP_PASS:-RAFG^&hwB|!8Bvd}
      - CONTACT_RECEIVER_EMAIL=${CONTACT_RECEIVER_EMAIL:-rahulkumardrop@gmail.com}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
